<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator - INR</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function LoanCalculator() {
          const [totalAmount, setTotalAmount] = useState(500000);
          const [downPayment, setDownPayment] = useState(100000);
          const [rate, setRate] = useState(10);
          const [tenure, setTenure] = useState(12);
          const [calculationType, setCalculationType] = useState('flat');

          const principal = totalAmount - downPayment;
          const downPaymentPercent = totalAmount > 0 ? ((downPayment / totalAmount) * 100).toFixed(1) : 0;

          const formatINR = (amount) => {
            return new Intl.NumberFormat('en-IN', {
              style: 'currency',
              currency: 'INR',
              maximumFractionDigits: 0
            }).format(amount);
          };

          const formatNumber = (amount) => {
            return Math.round(amount);
          };

          const calculateFlatRate = () => {
            const totalInterest = (principal * rate * tenure) / (12 * 100);
            const totalAmount = principal + totalInterest;
            const monthlyEMI = totalAmount / tenure;
            
            return {
              monthlyEMI,
              totalInterest,
              totalAmount,
              schedule: Array.from({ length: tenure }, (_, i) => ({
                month: i + 1,
                emi: monthlyEMI,
                principal: principal / tenure,
                interest: totalInterest / tenure,
                balance: principal - (principal / tenure) * (i + 1)
              }))
            };
          };

          const calculateDiminishing = () => {
            const monthlyRate = rate / (12 * 100);
            const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenure)) / 
                        (Math.pow(1 + monthlyRate, tenure) - 1);
            
            let balance = principal;
            const schedule = [];
            let totalInterest = 0;

            for (let i = 0; i < tenure; i++) {
              const interestPortion = balance * monthlyRate;
              const principalPortion = emi - interestPortion;
              balance -= principalPortion;
              totalInterest += interestPortion;

              schedule.push({
                month: i + 1,
                emi: emi,
                principal: principalPortion,
                interest: interestPortion,
                balance: Math.max(0, balance)
              });
            }

            return {
              monthlyEMI: emi,
              totalInterest,
              totalAmount: principal + totalInterest,
              schedule
            };
          };

          const flatResults = calculateFlatRate();
          const diminishingResults = calculateDiminishing();
          const results = calculationType === 'flat' ? flatResults : diminishingResults;

          // Export to Excel
          const exportToExcel = () => {
            const wb = XLSX.utils.book_new();
            
            // Summary Sheet
            const summaryData = [
              ['LOAN CALCULATOR SUMMARY'],
              [''],
              ['Calculation Type:', calculationType === 'flat' ? 'Flat Rate' : 'Diminishing Balance'],
              ['Total Amount (₹):', formatNumber(totalAmount)],
              ['Down Payment (₹):', formatNumber(downPayment)],
              ['Down Payment (%):', downPaymentPercent + '%'],
              ['Loan Amount (₹):', formatNumber(principal)],
              ['Interest Rate (% p.a.):', rate],
              ['Tenure (months):', tenure],
              [''],
              ['RESULTS'],
              ['Monthly EMI (₹):', formatNumber(results.monthlyEMI)],
              ['Total Interest (₹):', formatNumber(results.totalInterest)],
              ['Total Amount Payable (₹):', formatNumber(results.totalAmount)],
              ['Total Cost (Down Payment + EMI) (₹):', formatNumber(downPayment + results.totalAmount)],
              [''],
              ['COMPARISON'],
              ['Flat Rate - Monthly EMI (₹):', formatNumber(flatResults.monthlyEMI)],
              ['Flat Rate - Total Interest (₹):', formatNumber(flatResults.totalInterest)],
              ['Diminishing - Monthly EMI (₹):', formatNumber(diminishingResults.monthlyEMI)],
              ['Diminishing - Total Interest (₹):', formatNumber(diminishingResults.totalInterest)],
              ['Interest Savings (₹):', formatNumber(Math.abs(flatResults.totalInterest - diminishingResults.totalInterest))],
            ];
            
            const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
            ws1['!cols'] = [{ wch: 35 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws1, 'Summary');

            // Amortization Schedule Sheet
            const scheduleData = [
              ['REPAYMENT SCHEDULE - ' + (calculationType === 'flat' ? 'FLAT RATE' : 'DIMINISHING BALANCE')],
              [''],
              ['Month', 'EMI (₹)', 'Principal (₹)', 'Interest (₹)', 'Balance (₹)']
            ];
            
            results.schedule.forEach(row => {
              scheduleData.push([
                row.month,
                formatNumber(row.emi),
                formatNumber(row.principal),
                formatNumber(row.interest),
                formatNumber(row.balance)
              ]);
            });

            // Add totals
            const totalEMI = results.schedule.reduce((sum, row) => sum + row.emi, 0);
            const totalPrincipal = results.schedule.reduce((sum, row) => sum + row.principal, 0);
            const totalInterestPaid = results.schedule.reduce((sum, row) => sum + row.interest, 0);
            
            scheduleData.push([]);
            scheduleData.push([
              'TOTAL',
              formatNumber(totalEMI),
              formatNumber(totalPrincipal),
              formatNumber(totalInterestPaid),
              ''
            ]);

            const ws2 = XLSX.utils.aoa_to_sheet(scheduleData);
            ws2['!cols'] = [{ wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];
            XLSX.utils.book_append_sheet(wb, ws2, 'Repayment Schedule');

            // Download
            XLSX.writeFile(wb, `Loan_Calculator_${calculationType}_${Date.now()}.xlsx`);
          };

          // Export to PDF
          const exportToPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Title
            doc.setFontSize(20);
            doc.setTextColor(37, 99, 235);
            doc.text('LOAN CALCULATOR', 105, 20, { align: 'center' });

            // Loan Details
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text('Loan Details', 14, 35);
            
            const loanDetails = [
              ['Calculation Type', calculationType === 'flat' ? 'Flat Rate' : 'Diminishing Balance'],
              ['Total Amount', formatINR(totalAmount)],
              ['Down Payment', formatINR(downPayment) + ' (' + downPaymentPercent + '%)'],
              ['Loan Amount', formatINR(principal)],
              ['Interest Rate', rate + '% per annum'],
              ['Tenure', tenure + ' months'],
            ];

            doc.autoTable({
              startY: 40,
              head: [],
              body: loanDetails,
              theme: 'grid',
              headStyles: { fillColor: [37, 99, 235] },
              margin: { left: 14 },
              columnStyles: {
                0: { cellWidth: 60, fontStyle: 'bold' },
                1: { cellWidth: 120 }
              }
            });

            // Results
            let yPos = doc.lastAutoTable.finalY + 15;
            doc.setFontSize(12);
            doc.text('Calculation Results', 14, yPos);
            
            const resultsData = [
              ['Monthly EMI', formatINR(results.monthlyEMI)],
              ['Total Interest', formatINR(results.totalInterest)],
              ['Total Amount Payable', formatINR(results.totalAmount)],
              ['Total Cost (Down Payment + EMI)', formatINR(downPayment + results.totalAmount)],
            ];

            doc.autoTable({
              startY: yPos + 5,
              head: [],
              body: resultsData,
              theme: 'grid',
              headStyles: { fillColor: [37, 99, 235] },
              margin: { left: 14 },
              columnStyles: {
                0: { cellWidth: 60, fontStyle: 'bold' },
                1: { cellWidth: 120, fontStyle: 'bold', textColor: [37, 99, 235] }
              }
            });

            // Comparison
            yPos = doc.lastAutoTable.finalY + 15;
            doc.setFontSize(12);
            doc.text('Comparison: Flat Rate vs Diminishing Balance', 14, yPos);
            
            const comparisonData = [
              ['Method', 'Monthly EMI', 'Total Interest'],
              ['Flat Rate', formatINR(flatResults.monthlyEMI), formatINR(flatResults.totalInterest)],
              ['Diminishing Balance', formatINR(diminishingResults.monthlyEMI), formatINR(diminishingResults.totalInterest)],
              ['Difference', 
                formatINR(Math.abs(flatResults.monthlyEMI - diminishingResults.monthlyEMI)),
                formatINR(Math.abs(flatResults.totalInterest - diminishingResults.totalInterest))
              ],
            ];

            doc.autoTable({
              startY: yPos + 5,
              head: [comparisonData[0]],
              body: comparisonData.slice(1),
              theme: 'striped',
              headStyles: { fillColor: [37, 99, 235] },
              margin: { left: 14, right: 14 },
            });

            // New page for schedule
            doc.addPage();
            doc.setFontSize(14);
            doc.setTextColor(37, 99, 235);
            doc.text('Repayment Schedule - ' + (calculationType === 'flat' ? 'Flat Rate' : 'Diminishing Balance'), 14, 20);

            const scheduleHeaders = [['Month', 'EMI', 'Principal', 'Interest', 'Balance']];
            const scheduleBody = results.schedule.map(row => [
              row.month,
              formatINR(row.emi),
              formatINR(row.principal),
              formatINR(row.interest),
              formatINR(row.balance)
            ]);

            doc.autoTable({
              startY: 25,
              head: scheduleHeaders,
              body: scheduleBody,
              theme: 'striped',
              headStyles: { fillColor: [37, 99, 235] },
              styles: { fontSize: 8 },
              columnStyles: {
                0: { cellWidth: 20 },
                1: { cellWidth: 35 },
                2: { cellWidth: 35 },
                3: { cellWidth: 35 },
                4: { cellWidth: 35 }
              }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
              doc.setPage(i);
              doc.setFontSize(8);
              doc.setTextColor(128, 128, 128);
              doc.text(`Page ${i} of ${pageCount}`, 105, 290, { align: 'center' });
              doc.text(`Generated on ${new Date().toLocaleDateString('en-IN')}`, 14, 290);
            }

            // Download
            doc.save(`Loan_Calculator_${calculationType}_${Date.now()}.pdf`);
          };

          const Download = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          );

          const TrendingUp = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
          );

          const TrendingDown = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
          );

          const Calculator = () => (
            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          );

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
              <div className="max-w-6xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                  {/* Header */}
                  <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 sm:p-8">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-3">
                        <Calculator />
                        <h1 className="text-2xl sm:text-3xl font-bold text-white">Loan Calculator</h1>
                      </div>
                      {/* Export Buttons */}
                      <div className="flex gap-2">
                        <button
                          onClick={exportToExcel}
                          className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-all shadow-lg"
                        >
                          <Download />
                          <span className="hidden sm:inline">Excel</span>
                        </button>
                        <button
                          onClick={exportToPDF}
                          className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-all shadow-lg"
                        >
                          <Download />
                          <span className="hidden sm:inline">PDF</span>
                        </button>
                      </div>
                    </div>
                    <p className="text-blue-100">Calculate your EMI with flat rate or diminishing balance interest</p>
                  </div>

                  <div className="p-6 sm:p-8">
                    {/* Input Section */}
                    <div className="grid md:grid-cols-2 gap-6 mb-8">
                      <div className="space-y-6">
                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Total Amount (₹)
                          </label>
                          <input
                            type="number"
                            value={totalAmount}
                            onChange={(e) => setTotalAmount(Number(e.target.value))}
                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                            min="1000"
                            step="1000"
                          />
                          <input
                            type="range"
                            value={totalAmount}
                            onChange={(e) => setTotalAmount(Number(e.target.value))}
                            min="10000"
                            max="10000000"
                            step="10000"
                            className="w-full mt-2"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Down Payment (₹) - {downPaymentPercent}%
                          </label>
                          <input
                            type="number"
                            value={downPayment}
                            onChange={(e) => setDownPayment(Math.min(Number(e.target.value), totalAmount))}
                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                            min="0"
                            max={totalAmount}
                            step="1000"
                          />
                          <input
                            type="range"
                            value={downPayment}
                            onChange={(e) => setDownPayment(Number(e.target.value))}
                            min="0"
                            max={totalAmount}
                            step="1000"
                            className="w-full mt-2"
                          />
                          <div className="mt-2 p-3 bg-blue-50 rounded-lg border border-blue-200">
                            <p className="text-sm text-gray-700">
                              <span className="font-semibold text-blue-700">Loan Amount: </span>
                              {formatINR(principal)}
                            </p>
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Interest Rate (% per annum)
                          </label>
                          <input
                            type="number"
                            value={rate}
                            onChange={(e) => setRate(Number(e.target.value))}
                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                            min="0.1"
                            step="0.1"
                          />
                          <input
                            type="range"
                            value={rate}
                            onChange={(e) => setRate(Number(e.target.value))}
                            min="1"
                            max="36"
                            step="0.5"
                            className="w-full mt-2"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-semibold text-gray-700 mb-2">
                            Loan Tenure (months)
                          </label>
                          <input
                            type="number"
                            value={tenure}
                            onChange={(e) => setTenure(Number(e.target.value))}
                            className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg"
                            min="1"
                            step="1"
                          />
                          <input
                            type="range"
                            value={tenure}
                            onChange={(e) => setTenure(Number(e.target.value))}
                            min="6"
                            max="360"
                            step="6"
                            className="w-full mt-2"
                          />
                        </div>
                      </div>

                      {/* Results Section */}
                      <div className="space-y-4">
                        {/* Interest Type Selector */}
                        <div className="flex gap-2 mb-4">
                          <button
                            onClick={() => setCalculationType('flat')}
                            className={`flex-1 py-3 px-4 rounded-lg font-semibold transition-all flex items-center justify-center gap-2 ${
                              calculationType === 'flat'
                                ? 'bg-blue-600 text-white shadow-lg'
                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                            }`}
                          >
                            <TrendingUp />
                            Flat Rate
                          </button>
                          <button
                            onClick={() => setCalculationType('diminishing')}
                            className={`flex-1 py-3 px-4 rounded-lg font-semibold transition-all flex items-center justify-center gap-2 ${
                              calculationType === 'diminishing'
                                ? 'bg-indigo-600 text-white shadow-lg'
                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                            }`}
                          >
                            <TrendingDown />
                            Diminishing
                          </button>
                        </div>

                        {/* Down Payment Summary */}
                        <div className="bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl p-4 border-2 border-green-200">
                          <p className="text-xs text-gray-600 mb-2 font-semibold">Payment Breakdown</p>
                          <div className="space-y-2 text-sm">
                            <div className="flex justify-between">
                              <span className="text-gray-700">Total Amount:</span>
                              <span className="font-semibold text-gray-800">{formatINR(totalAmount)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span className="text-gray-700">Down Payment:</span>
                              <span className="font-semibold text-green-600">{formatINR(downPayment)}</span>
                            </div>
                            <div className="flex justify-between pt-2 border-t border-green-300">
                              <span className="text-gray-700 font-semibold">Loan Amount:</span>
                              <span className="font-bold text-blue-600">{formatINR(principal)}</span>
                            </div>
                          </div>
                        </div>

                        <div className="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6 border-2 border-blue-200">
                          <div className="text-center mb-4">
                            <p className="text-sm text-gray-600 mb-1">Monthly EMI</p>
                            <p className="text-3xl sm:text-4xl font-bold text-blue-600">
                              {formatINR(results.monthlyEMI)}
                            </p>
                          </div>

                          <div className="grid grid-cols-2 gap-4">
                            <div className="text-center bg-white rounded-lg p-3">
                              <p className="text-xs text-gray-600 mb-1">Principal</p>
                              <p className="text-lg font-semibold text-gray-800">{formatINR(principal)}</p>
                            </div>
                            <div className="text-center bg-white rounded-lg p-3">
                              <p className="text-xs text-gray-600 mb-1">Total Interest</p>
                              <p className="text-lg font-semibold text-orange-600">{formatINR(results.totalInterest)}</p>
                            </div>
                          </div>

                          <div className="mt-4 text-center bg-white rounded-lg p-3">
                            <p className="text-xs text-gray-600 mb-1">Total Amount Payable (EMI)</p>
                            <p className="text-xl font-bold text-indigo-600">{formatINR(results.totalAmount)}</p>
                          </div>

                          <div className="mt-4 text-center bg-gradient-to-r from-purple-100 to-pink-100 rounded-lg p-3 border-2 border-purple-300">
                            <p className="text-xs text-gray-600 mb-1">Total Cost (Down Payment + EMI)</p>
                            <p className="text-xl font-bold text-purple-700">{formatINR(downPayment + results.totalAmount)}</p>
                          </div>
                        </div>

                        {/* Comparison Card */}
                        <div className="bg-amber-50 rounded-xl p-4 border-2 border-amber-200">
                          <p className="text-sm font-semibold text-amber-800 mb-2">Compare Both Methods:</p>
                          <div className="space-y-2 text-sm">
                            <div className="flex justify-between">
                              <span className="text-gray-600">Flat Rate EMI:</span>
                              <span className="font-semibold">{formatINR(flatResults.monthlyEMI)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span className="text-gray-600">Diminishing EMI:</span>
                              <span className="font-semibold">{formatINR(diminishingResults.monthlyEMI)}</span>
                            </div>
                            <div className="pt-2 border-t border-amber-300">
                              <div className="flex justify-between">
                                <span className="text-gray-600">Difference:</span>
                                <span className={`font-bold ${flatResults.totalInterest > diminishingResults.totalInterest ? 'text-green-600' : 'text-orange-600'}`}>
                                  {formatINR(Math.abs(flatResults.totalInterest - diminishingResults.totalInterest))}
                                </span>
                              </div>
                              <p className="text-xs text-gray-600 mt-1">
                                {diminishingResults.totalInterest < flatResults.totalInterest 
                                  ? '✓ Diminishing balance saves you interest'
                                  : '✓ Flat rate has lower total interest'}
                              </p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Amortization Schedule */}
                    <div className="mt-8">
                      <h2 className="text-xl font-bold text-gray-800 mb-4">
                        Repayment Schedule ({calculationType === 'flat' ? 'Flat Rate' : 'Diminishing Balance'})
                      </h2>
                      <div className="overflow-x-auto bg-gray-50 rounded-lg border border-gray-200">
                        <table className="w-full text-sm">
                          <thead className="bg-gray-200">
                            <tr>
                              <th className="px-4 py-3 text-left font-semibold text-gray-700">Month</th>
                              <th className="px-4 py-3 text-right font-semibold text-gray-700">EMI</th>
                              <th className="px-4 py-3 text-right font-semibold text-gray-700">Principal</th>
                              <th className="px-4 py-3 text-right font-semibold text-gray-700">Interest</th>
                              <th className="px-4 py-3 text-right font-semibold text-gray-700">Balance</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-200">
                            {results.schedule.map((row, idx) => (
                              <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                <td className="px-4 py-3 font-medium text-gray-800">{row.month}</td>
                                <td className="px-4 py-3 text-right text-gray-800">{formatINR(row.emi)}</td>
                                <td className="px-4 py-3 text-right text-blue-600">{formatINR(row.principal)}</td>
                                <td className="px-4 py-3 text-right text-orange-600">{formatINR(row.interest)}</td>
                                <td className="px-4 py-3 text-right font-semibold text-gray-800">{formatINR(row.balance)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Information Section */}
                    <div className="mt-8 grid md:grid-cols-2 gap-4">
                      <div className="bg-blue-50 rounded-lg p-4 border border-blue-200">
                        <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
                          <TrendingUp />
                          Flat Rate Method
                        </h3>
                        <p className="text-sm text-gray-700">
                          Interest is calculated on the original principal amount throughout the loan tenure. 
                          EMI remains constant. Total interest is higher compared to diminishing balance.
                        </p>
                      </div>
                      <div className="bg-indigo-50 rounded-lg p-4 border border-indigo-200">
                        <h3 className="font-bold text-indigo-800 mb-2 flex items-center gap-2">
                          <TrendingDown />
                          Diminishing Balance Method
                        </h3>
                        <p className="text-sm text-gray-700">
                          Interest is calculated on the outstanding principal balance, which reduces with each payment. 
                          More cost-effective over time as you pay interest only on the remaining amount.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Footer - Developer Credit */}
                  <div className="bg-gradient-to-r from-gray-100 to-gray-200 py-4 px-6 border-t border-gray-300">
                    <p className="text-center text-sm text-gray-700">
                      Developed and Designed by <span className="font-bold text-blue-600">Shamsudeen EP</span>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<LoanCalculator />, document.getElementById('root'));
    </script>
</body>
</html>
